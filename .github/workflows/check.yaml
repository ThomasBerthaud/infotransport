# Single workflow for Gitea Actions and GitHub Actions: Gitea reads .github/workflows
# when no .gitea/workflows directory exists, so do not add one.
name: Quality
# Pushes run only on main (after a merge). A pushed branch is checked through its
# pull request, so it does not also run a duplicate `push` job.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run test
      - run: npm run build
